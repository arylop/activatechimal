
{% extends "base.html" %}

{% block title %}
Registro | Activate + Chimal
{% endblock %}

{% block contenido %}

<section class="tarjeta auth">

    <div class="icono-grande">🌟</div>

    <p class="etiqueta">
        Únete a la comunidad
    </p>

    <h1>Crear una cuenta</h1>

    <form method="POST" class="formulario">

        <label>
            Nombre completo

            <input
                type="text"
                name="nombre"
                required
                maxlength="100"
                placeholder="Tu nombre"
            >
        </label>

        <label>
            Nombre de usuario

            <input
                type="text"
                name="usuario"
                required
                maxlength="40"
                autocomplete="username"
                placeholder="Ej. ana123"
            >
        </label>

        <label>
            Correo electrónico

            <input
                type="email"
                name="correo"
                required
                maxlength="150"
                autocomplete="email"
                placeholder="correo@ejemplo.com"
            >
        </label>

        <label>
            Contraseña

            <input
                type="password"
                name="password"
                required
                minlength="8"
                autocomplete="new-password"
                placeholder="Mínimo 8 caracteres"
            >
        </label>

        <button type="submit">
            Crear cuenta
        </button>

    </form>

    <p class="centrado">
        ¿Ya tienes cuenta?

        <a href="{{ url_for('login') }}">
            Inicia sesión
        </a>
    </p>

</section>

{% endblock %}
